<!doctype html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Prinz Rudolf · Andamento Prezzi</title>
<style>
:root{--wine:#7a1f2b;--wd:#5c121c;--ink:#222;--muted:#777;--line:#e5e0dc;--bg:#f6f3f1;--up:#c0392b;--down:#1e7a46}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(160deg,var(--wine),var(--wd));color:#fff;padding:16px 14px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:18px;font-weight:800}header p{margin:4px 0 0;font-size:12px;opacity:.85}
.wrap{max-width:820px;margin:0 auto;padding:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.srch{flex:1;min-width:150px;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:15px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-size:13px;font-weight:700;cursor:pointer}
.btn.on{background:var(--wine);color:#fff;border-color:var(--wine)}
.muted{color:var(--muted);font-size:12px}
.forn{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.fh{background:#faf7f5;padding:11px 13px;font-weight:800;color:var(--wine);display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.fh .cnt{font-size:12px;color:var(--muted);font-weight:700}
.fb{display:none}.fb.on{display:block}
.it{padding:9px 13px;border-top:1px solid #f0ece9;display:flex;gap:10px;align-items:baseline}
.it .nm{flex:1;font-size:14px}
.it .u{font-size:11px;color:var(--muted)}
.it .pr{font-weight:800;font-size:14px;white-space:nowrap}
.it .ch{font-size:12px;font-weight:800;white-space:nowrap;min-width:52px;text-align:right}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--muted)}
.hist{font-size:11px;color:var(--muted);margin-top:2px}
.empty{padding:20px;text-align:center;color:var(--muted)}
.alert{background:#fff4f2;border:1px solid #f1c4bb;border-left:5px solid var(--up);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.ahead{font-weight:800;color:var(--up);font-size:14px;margin-bottom:6px}
.arow{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px dotted #f0cfc8;font-size:13px}
.arow:first-of-type{border-top:none}
.arow .an{flex:1}.arow .an small{color:var(--muted);font-weight:700}
.arow .av{white-space:nowrap;color:#444}.arow .av b{color:var(--up)}
.anote{font-size:11px;color:var(--muted);margin-top:6px}
</style></head><body>
<header><h1>📈 Andamento Prezzi</h1><p>Storico prezzi dei fornitori dalle bolle · verde = sceso, rosso = aumentato</p></header>
<div class="wrap">
  <div class="bar">
    <input class="srch" id="q" placeholder="Cerca un prodotto…" oninput="render()">
    <button class="btn" id="fb" onclick="toggleF()">Solo variazioni</button>
    <button class="btn" id="sb2" onclick="toggleSpesa()">💰 Top spesa</button>
    <span class="muted" id="st"></span>
  </div>
  <div id="list"></div>
</div>
<script>
const SB="https://hxjxbpifboufolhwawkc.supabase.co",KEY="sb_publishable_Fxh5-b2a7Qtt-Pumw0MrMg_Hpjd2m7Y";
function sb(p){return fetch(SB+'/rest/v1/'+p,{headers:{apikey:KEY}}).then(r=>r.json());}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
var DATA=[],OPEN={},ONLYCH=false,TOPS=null,MODE='prezzi';
function fmt(n){return n.toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2});}
async function load(){
  document.getElementById('st').textContent='carico…';
  var ks=await sb("kitchen_meta?k=like.listino*&select=k");
  for(const row of ks){
    var v=(await sb("kitchen_meta?k=eq."+encodeURIComponent(row.k)+"&select=v"))[0].v;
    var forn=v.forn||row.k.split('|')[1], items=[];
    var it=v.items||{};
    for(const c in it){
      var o=it[c], d=(o.d||'').trim(); if(!d)continue;
      var h=(o.hist||[]).slice().filter(x=>x&&x.p!=null); if(!h.length)continue;
      h.sort((a,b)=>(a.at||'')<(b.at||'')?-1:1);
      var last=h[h.length-1], prev=null;
      for(var i=h.length-2;i>=0;i--){ if(h[i].p!==last.p){prev=h[i];break;} }
      var chg=prev?((last.p-prev.p)/prev.p*100):null;
      items.push({d, u:o.u||'', p:last.p, at:last.at, prevP:prev?prev.p:null, prevAt:prev?prev.at:null, chg, n:h.length});
    }
    items.sort((a,b)=>a.d.toLowerCase()<b.d.toLowerCase()?-1:1);
    if(items.length)DATA.push({forn, items});
  }
  DATA.sort((a,b)=>b.items.length-a.items.length);
  try{var tr=await sb("kitchen_meta?k=like.topspesa*&select=k,v");if(tr&&tr.length){tr.sort((a,b)=>a.k<b.k?1:-1);TOPS=tr[0].v;}}catch(e){}
  document.getElementById('st').textContent='';
  render();
}
function toggleSpesa(){MODE=MODE==='spesa'?'prezzi':'spesa';document.getElementById('sb2').classList.toggle('on',MODE==='spesa');render();}
function renderSpesa(){
  if(!TOPS||!TOPS.items){document.getElementById('list').innerHTML='<div class="empty">Classifica spesa non ancora disponibile.</div>';return;}
  var mx=TOPS.items[0].eur||1;
  var h='<div class="forn"><div class="fh"><span>💰 Top prodotti per spesa · '+esc(TOPS.mese||'')+'</span><span class="cnt">tot. tracciato € '+fmt(TOPS.tot)+'</span></div><div class="fb on">';
  TOPS.items.forEach(function(x,i){
    h+='<div class="it"><div class="nm">'+(i+1)+'. '+esc(x.d)+'<div style="height:5px;background:#eef5f1;border-radius:4px;margin-top:4px"><div style="height:5px;background:var(--wine);border-radius:4px;width:'+Math.round(x.eur/mx*100)+'%"></div></div></div><div class="pr">€ '+fmt(x.eur)+'</div></div>';
  });
  h+='</div></div><div class="muted" style="padding:4px 2px">Spesa per singolo prodotto nel mese (somma delle bolle). Le voci più grandi pesano di più sul totale.</div>';
  document.getElementById('list').innerHTML=h;
}
function toggleF(){ONLYCH=!ONLYCH;document.getElementById('fb').classList.toggle('on',ONLYCH);render();}
function alertsHtml(){
  var al=[];
  DATA.forEach(function(f){var soglia=/gastro/i.test(f.forn)?30:8;
    f.items.forEach(function(x){ if(x.chg!==null && x.chg>=soglia){ al.push({forn:f.forn,d:x.d,from:x.prevP,to:x.p,chg:x.chg}); } });});
  if(!al.length)return '<div class="alert" style="background:#eef7f0;border-color:#bfe0cc;border-left-color:var(--down)"><div class="ahead" style="color:var(--down)">✓ Nessun prezzo anomalo</div><div class="anote">Nessun rincaro sopra soglia nelle ultime bolle.</div></div>';
  al.sort(function(a,b){return b.chg-a.chg;});
  return '<div class="alert"><div class="ahead">⚠️ Prezzi da controllare ('+al.length+')</div>'+
    al.slice(0,40).map(function(a){return '<div class="arow"><span class="an">'+esc(a.d)+' <small>'+esc(a.forn)+'</small></span><span class="av">€'+fmt(a.from)+' → €'+fmt(a.to)+' <b>+'+a.chg.toFixed(0)+'%</b></span></div>';}).join('')+
    '<div class="anote">Soglia: +8% (ortofrutta fresca +30%, perché oscilla con la stagione). Controlla che non sia un errore o una fine-offerta.</div></div>';
}
function render(){
  if(MODE==='spesa'){renderSpesa();return;}
  var q=(document.getElementById('q').value||'').toLowerCase().trim();
  var h='';
  if(!q)h+=alertsHtml();
  DATA.forEach(function(f,fi){
    var items=f.items.filter(function(x){
      if(q&&x.d.toLowerCase().indexOf(q)<0)return false;
      if(ONLYCH&&!(x.chg!==null&&Math.abs(x.chg)>=0.5))return false;
      return true;
    });
    if(!items.length)return;
    var open=OPEN[fi]!==undefined?OPEN[fi]:(q||ONLYCH?true:false);
    h+='<div class="forn"><div class="fh" onclick="tog('+fi+')"><span>'+esc(f.forn)+'</span><span class="cnt">'+items.length+' prodotti '+(open?'▴':'▾')+'</span></div><div class="fb'+(open?' on':'')+'">';
    items.forEach(function(x){
      var ch='<span class="ch flat">—</span>';
      if(x.chg!==null){var cls=x.chg>0.4?'up':(x.chg<-0.4?'down':'flat');var sign=x.chg>0?'+':'';ch='<span class="ch '+cls+'">'+sign+x.chg.toFixed(0)+'%</span>';}
      var sub=x.prevP!=null?('prec. € '+fmt(x.prevP)+(x.prevAt?' ('+x.prevAt+')':'')):('solo 1 prezzo');
      h+='<div class="it"><div class="nm">'+esc(x.d)+' <span class="u">'+esc(x.u)+'</span><div class="hist">ultimo '+(x.at||'')+' · '+sub+'</div></div><div class="pr">€ '+fmt(x.p)+'</div>'+ch+'</div>';
    });
    h+='</div></div>';
  });
  document.getElementById('list').innerHTML=h||'<div class="empty">Nessun prodotto trovato.</div>';
}
function tog(fi){OPEN[fi]=!(OPEN[fi]!==undefined?OPEN[fi]:false);render();}
load();
</script></body></html>

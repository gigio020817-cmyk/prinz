<!DOCTYPE html>
<html lang="it"><head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Diario"><meta name="theme-color" content="#111111"><meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<title>Prinz Rudolf · Diario lavori</title>
<style>
 :root{--nero:#1c1c1c;--nero-d:#000;--cream:#faf8f2;--paper:#fff;--ink:#1a1a1a;--muted:#8a8378;--line:#ececec;--gold:#c9a227;--yellow:#f5c518;--wa:#25d366}
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%}
 body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--cream);color:var(--ink);line-height:1.45;padding-bottom:env(safe-area-inset-bottom)}
 #lock{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,var(--nero),var(--nero-d));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;color:#fff;text-align:center}
 #lock .mark{width:70px;height:70px;border-radius:18px;border:2px solid var(--gold);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:24px;margin-bottom:18px}
 #lock h1{font-size:22px;margin:0 0 4px}#lock p{opacity:.85;font-size:13px;margin:0 0 22px;letter-spacing:1px}#lock .box{width:100%;max-width:320px}
 #lock input{width:100%;border:none;border-radius:13px;padding:15px;font-size:17px;text-align:center;color:var(--ink);margin-bottom:12px}
 #lock button{width:100%;border:none;border-radius:13px;padding:15px;font-size:17px;font-weight:800;background:linear-gradient(135deg,var(--yellow),var(--gold));color:#1a1400;cursor:pointer}
 #lock .err{color:#ffd2d2;font-size:13px;height:18px;margin-top:8px}#lock label{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;opacity:.9;margin-top:14px;cursor:pointer}#lock label input{width:auto;margin:0}
 header{position:sticky;top:0;z-index:20;background:linear-gradient(160deg,var(--nero),var(--nero-d));color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;box-shadow:0 2px 14px rgba(0,0,0,.2)}
 .brand{display:flex;align-items:center;gap:11px}.brand .mark{width:36px;height:36px;border-radius:9px;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--gold);font-size:15px;flex:none}
 .brand h1{font-size:17px;margin:0;font-weight:800}.brand small{display:block;font-size:10px;opacity:.8;letter-spacing:1.4px;text-transform:uppercase;font-weight:700}
 main{max-width:820px;margin:0 auto;padding:14px}
 #status{font-size:12px;color:var(--muted);margin:2px 0 12px;text-align:center;font-weight:600}
 .newbtn{width:100%;border:1.5px dashed var(--gold);background:#fffdf5;color:#8a6d00;border-radius:13px;padding:13px;font-size:15px;font-weight:800;cursor:pointer;margin-bottom:14px}
 .day{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:13px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
 .dayh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
 .dayh .dt{font-size:16px;font-weight:800;flex:1}
 .dayh .wd{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
 .day textarea{width:100%;min-height:150px;border:1px solid #d7d2c6;border-radius:10px;padding:11px;font-size:14.5px;font-family:inherit;line-height:1.5;background:#fffdf9;resize:vertical}
 .btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
 .btns button{flex:1 1 auto;border:none;border-radius:10px;padding:11px 12px;font-size:14px;font-weight:800;cursor:pointer;white-space:nowrap}
 .b-wa{background:var(--wa);color:#fff} .b-save{background:var(--nero);color:#fff} .b-copy{background:#e9e4d8;color:#4a4staff} .b-copy{color:#4a4433}
 .empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:14px}
 #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#15201a;color:#fff;padding:11px 16px;border-radius:12px;font-size:13.5px;font-weight:700;opacity:0;transition:opacity .2s;z-index:80;pointer-events:none}#toast.show{opacity:.97}
 #verbadge{position:fixed;left:6px;bottom:6px;z-index:9999;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:2px 7px;border-radius:10px;pointer-events:none}
</style><script src="devicegate.js"></script>
</head>
<body>
<div id="lock"><div class="mark">PR</div><h1>Diario lavori</h1><p>PRINZ RUDOLF · RISERVATO</p>
 <div class="box"><input id="pw" type="password" placeholder="Password" autocomplete="current-password" enterkeyhint="go"><button id="enter">Entra</button><div class="err" id="err"></div>
 <label><input type="checkbox" id="remember" checked> Ricorda su questo dispositivo</label></div></div>
<div id="app" style="display:none">
 <header><div class="brand"><div class="mark">PR</div><div><small>Prinz Rudolf · Cucina</small><h1>Diario lavori</h1></div></div></header>
 <main>
  <div id="status">Caricamento…</div>
  <button class="newbtn" id="newDay">＋ Aggiungi giornata di oggi</button>
  <div id="list"></div>
 </main>
</div>
<div id="toast"></div>
<div id="verbadge">v 08/11 00:30</div>
<script>
const SB_URL="https://hxjxbpifboufolhwawkc.supabase.co";
const SB_KEY="sb_publishable_Fxh5-b2a7Qtt-Pumw0MrMg_Hpjd2m7Y";
const APP_PW="Rachi020817";
const APP_VER='08/11 00:30';
function el(id){return document.getElementById(id);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];});}
function toast(t){var e=el('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('show');},1700);}
async function sb(path,opt){opt=opt||{};var h=Object.assign({apikey:SB_KEY,'Content-Type':'application/json'},opt.headers||{});var r=await fetch(SB_URL+'/rest/v1/'+path,Object.assign({},opt,{headers:h}));if(!r.ok)throw new Error('HTTP '+r.status);var t=await r.text();return t?JSON.parse(t):[];}
function pad(n){return ('0'+n).slice(-2);}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
/* giorno di lavoro: prima delle 5 del mattino conta ancora il giorno prima */
function workDay(){var d=new Date();if(d.getHours()<5){d.setDate(d.getDate()-1);}return ymd(d);}
var GG=['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
function dLabel(ds){var p=ds.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function dWeek(ds){try{return GG[new Date(ds+'T12:00:00').getDay()];}catch(e){return '';}}
function unlock(p,fs){var e=el('err');if(p!==APP_PW){e.textContent='Password errata';el('pw').value='';return;}if(el('remember').checked||fs){try{localStorage.setItem('diario_pw','1')}catch(_){}}el('lock').style.display='none';el('app').style.display='block';loadAll();}
el('enter').onclick=function(){unlock(el('pw').value,false);};
el('pw').addEventListener('keydown',function(e){if(e.key==='Enter')unlock(e.target.value,false);});
(async function selfUpdate(){try{if(sessionStorage.getItem('upd_diario'))return;var r=await fetch(location.pathname+'?chk='+Date.now(),{cache:'no-store'});if(!r.ok)return;var t=await r.text();var m=t.match(/>v (\d\d\/\d\d \d\d:\d\d)</);var latest=m&&m[1];if(latest&&latest!==APP_VER){sessionStorage.setItem('upd_diario','1');location.replace(location.pathname+'?v='+Date.now());}}catch(e){}})();
(function(){try{if(localStorage.getItem('pr_av_diario')!==APP_VER){localStorage.removeItem('diario_pw');localStorage.setItem('pr_av_diario',APP_VER);}}catch(_e){}var s=null;try{s=localStorage.getItem('diario_pw')}catch(e){}if(s)unlock(APP_PW,true);else setTimeout(function(){el('pw').focus();},300);})();

var DAYS=[];
async function loadAll(){el('status').textContent='Caricamento dal cloud…';try{
  var r=await sb('kitchen_meta?k=like.diario|*&select=k,v');
  DAYS=(r||[]).map(function(x){return {date:x.k.slice(7),text:(x.v&&x.v.text)||'',at:(x.v&&x.v.at)||null};}).filter(function(d){return !(d.text==='' && d._del);});
  DAYS.sort(function(a,b){return a.date<b.date?1:-1;});
  el('status').textContent='✓ Collegato · '+new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
  render();
 }catch(e){el('status').textContent='⚠️ Problema di collegamento. Controlla internet e riapri.';console.error(e);}}
function render(){
 if(!DAYS.length){el('list').innerHTML='<div class="empty">Ancora nessuna giornata. Tocca <b>＋ Aggiungi giornata di oggi</b>, oppure la scrive Claude dal computer e qui si aggiorna da sola.</div>';return;}
 el('list').innerHTML=DAYS.map(function(d){
  return '<div class="day"><div class="dayh"><div class="dt">'+dLabel(d.date)+'</div><div class="wd">'+dWeek(d.date)+'</div></div>'+
   '<textarea id="ta_'+d.date+'" placeholder="Cosa ho fatto oggi…">'+esc(d.text)+'</textarea>'+
   '<div class="btns"><button class="b-save" onclick="saveDay(\''+d.date+'\')">💾 Salva</button><button class="b-wa" onclick="waDay(\''+d.date+'\')">📲 WhatsApp</button><button class="b-copy" onclick="copyDay(\''+d.date+'\')">📋 Copia</button></div></div>';
 }).join('');
}
async function saveDay(date){var ta=el('ta_'+date);if(!ta)return;var text=ta.value;
 try{await sb('kitchen_meta?on_conflict=k',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({k:'diario|'+date,v:{text:text,at:new Date().toISOString()}})});
  var ex=DAYS.find(function(d){return d.date===date;});if(ex)ex.text=text;toast('✓ Salvato');
 }catch(e){toast('⚠️ Non salvato, controlla internet');console.error(e);}}
function dayText(date){var ta=el('ta_'+date);var txt=ta?ta.value:((DAYS.find(function(d){return d.date===date;})||{}).text||'');return 'PRINZ RUDOLF — Diario lavori\n'+dWeek(date)+' '+dLabel(date)+'\n\n'+txt;}
function waDay(date){var t=dayText(date);if(navigator.share){navigator.share({title:'Diario lavori — Prinz Rudolf',text:t}).catch(function(){});}else{window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');}}
function copyDay(date){var t=dayText(date);try{navigator.clipboard.writeText(t);toast('📋 Copiato');}catch(e){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('📋 Copiato');}catch(_){}document.body.removeChild(a);}}
el('newDay').onclick=function(){var d=workDay();if(DAYS.find(function(x){return x.date===d;})){toast('La giornata di oggi c\'è già');return;}DAYS.unshift({date:d,text:'',at:null});render();var ta=el('ta_'+d);if(ta)ta.focus();};
</script>
</body></html>

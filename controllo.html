<!doctype html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Prinz Rudolf · Spesa & Controllo</title>
<style>
:root{--wine:#7a1f2b;--wd:#5c121c;--gold:#c9a227;--line:#e5e0dc}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;background:#f6f3f1}
header{background:linear-gradient(160deg,var(--wine),var(--wd));color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 12px 0;flex:none}
.top{display:flex;align-items:center;gap:10px;padding-bottom:8px}
.top h1{margin:0;font-size:17px;font-weight:800;flex:1}
.top a.home{color:#fff;text-decoration:none;font-size:13px;font-weight:700;border:1px solid rgba(255,255,255,.4);border-radius:20px;padding:5px 12px}
.tabs{display:flex;gap:4px}
.tabs button{flex:1;border:none;background:transparent;color:#fff;opacity:.72;font-size:14px;font-weight:800;padding:11px 6px;border-bottom:3px solid transparent;cursor:pointer}
.tabs button.on{opacity:1;border-bottom-color:var(--gold)}
.frames{flex:1;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#f6f3f1}
iframe.hide{visibility:hidden;z-index:-1}
</style></head><body>
<header>
  <div class="top"><h1>📊 Spesa &amp; Controllo</h1><a class="home" href="index.html">⌂ Home</a></div>
  <div class="tabs">
    <button id="t_prezzi" class="on" onclick="show('prezzi')">📈 Andamento Prezzi</button>
    <button id="t_fatture" onclick="show('fatture')">🧾 Fatture e Controllo</button>
  </div>
</header>
<div class="frames">
  <iframe id="f_prezzi" src="andamento_prezzi.html?embed=1"></iframe>
  <iframe id="f_fatture" class="hide" data-src="fatture.html?embed=1"></iframe>
</div>
<script>
var LOADED={prezzi:true,fatture:false};
function show(which){
  var other=which==='prezzi'?'fatture':'prezzi';
  var fw=document.getElementById('f_'+which), fo=document.getElementById('f_'+other);
  if(!LOADED[which]){fw.src=fw.getAttribute('data-src');LOADED[which]=true;}
  fw.classList.remove('hide');fo.classList.add('hide');
  document.getElementById('t_'+which).classList.add('on');
  document.getElementById('t_'+other).classList.remove('on');
}
</script>
</body></html>

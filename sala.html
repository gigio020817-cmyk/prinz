<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sala">
<meta name="theme-color" content="#4a121b">
<meta name="robots" content="noindex, nofollow">
<title>Prinz Rudolf &middot; Sala</title>
<style>
  :root{--wine:#4a121b;--wine2:#6b1f2a;--gold:#c9a227;--cream:#faf6ee;--ink:#2a2119;--line:#e7ddca;--muted:#8a8378;--ok:#1e7a46;--red:#b23a3a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--cream);color:var(--ink);line-height:1.45;padding-bottom:env(safe-area-inset-bottom)}
  #lock{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,var(--wine),#2b0a10);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;color:#fff;text-align:center}
  #lock .mark{width:66px;height:66px;border-radius:16px;border:2px solid var(--gold);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:30px;margin-bottom:16px}
  #lock h1{font-size:22px;margin:0 0 2px;font-weight:700}
  #lock p{opacity:.85;font-size:12.5px;letter-spacing:1.5px;text-transform:uppercase;margin:0 0 24px;color:var(--gold)}
  #lock .box{width:100%;max-width:300px}
  #lock input{width:100%;border:none;border-radius:12px;padding:14px 16px;font-size:17px;text-align:center;color:var(--ink);margin-bottom:12px}
  #lock input:focus{outline:2px solid var(--gold)}
  #lock button{width:100%;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:800;background:linear-gradient(135deg,var(--gold),#a8841f);color:#231800;cursor:pointer}
  #lock .err{color:#ffd2d2;font-size:13px;height:18px;margin-top:10px}
  #lock label{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;opacity:.9;margin-top:14px;cursor:pointer}
  #lock label input{width:auto;margin:0}
  header{position:sticky;top:0;z-index:20;background:linear-gradient(160deg,var(--wine),#2b0a10);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;box-shadow:0 2px 14px rgba(0,0,0,.2)}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .mark{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--gold);font-size:15px;flex:none}
  .brand h1{font-size:18px;margin:0;font-weight:700}
  .brand small{display:block;font-size:10.5px;opacity:.85;letter-spacing:1.5px;text-transform:uppercase}
  .rolebadge{margin-left:auto;font-size:11px;font-weight:800;padding:5px 11px;border-radius:20px;background:rgba(255,255,255,.15);color:#fff}
  .rolebadge.dir{background:var(--gold);color:#231800}
  main{max-width:820px;margin:0 auto;padding:14px}
  .sectitle{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800;color:var(--wine);margin:6px 2px 12px}
  .tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
  .search{flex:1;min-width:150px;position:relative}
  .search input{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px 11px 36px;font-size:15px;background:#fff}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5}
  .addbtn{border:none;border-radius:12px;padding:11px 15px;font-size:14px;font-weight:800;background:var(--wine);color:#fff;cursor:pointer}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;margin-bottom:6px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 13px;font-size:13px;font-weight:700;color:var(--wine);cursor:pointer}
  .chip.on{background:var(--wine);color:#fff;border-color:var(--wine)}
  .grp{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);font-weight:800;margin:14px 4px 6px}
  .wine{background:#fff;border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:14px;padding:13px 15px;margin-bottom:11px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .wine .top{display:flex;align-items:flex-start;gap:10px}
  .wine .nome{font-size:16.5px;font-weight:800;color:var(--wine);flex:1;line-height:1.25}
  .wine .prezzo{font-weight:800;color:var(--ink);white-space:nowrap;font-size:15px}
  .tipo{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:20px;color:#fff;margin-top:3px}
  .t-rosso{background:#7b1e2b}.t-bianco{background:#b79a2a}.t-bollicine{background:#4a7a8a}.t-rosato{background:#c07a86}.t-dolce{background:#9a6b2b}
  .wine .sub{font-size:13px;color:var(--muted);margin-top:5px}
  .wine .abb{font-size:13.5px;margin-top:7px}
  .wine .abb b{color:var(--wine)}
  .wine .note{font-size:13px;color:#6b6257;margin-top:4px;font-style:italic}
  .wine .mag{font-size:12.5px;color:#7a6f60;margin-top:7px;background:#f6f1e6;border:1px dashed #d9cba6;border-radius:8px;padding:6px 9px}
  .wine .acts{display:flex;gap:8px;margin-top:10px}
  .wine .acts button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer}
  .wine .acts .mod{color:var(--wine)}.wine .acts .del{color:var(--red)}
  .empty{text-align:center;color:var(--muted);padding:44px 20px;font-size:15px}
  footer{text-align:center;font-size:11px;color:var(--muted);padding:22px}
  #modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;align-items:flex-end;justify-content:center;padding:0}
  #modal .sheet{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
  #modal h3{margin:2px 0 12px;color:var(--wine);font-size:19px}
  .fld{margin-bottom:11px}
  .fld label{display:block;font-size:12px;font-weight:800;color:var(--wine);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}
  .fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;font-size:15px;font-family:inherit;background:#fff}
  .fld textarea{min-height:60px;resize:vertical}
  .row2{display:flex;gap:10px}.row2>*{flex:1}
  .mbtns{display:flex;gap:10px;margin-top:14px}
  .mbtns button{flex:1;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:800;cursor:pointer}
  .mbtns .save{background:var(--wine);color:#fff}.mbtns .cancel{background:#eee;color:#333}
  .loading{text-align:center;color:var(--muted);padding:30px}
</style>
<script src="devicegate.js"></script>
</head>
<body>
<div id="lock">
  <div class="mark">PR</div>
  <h1>Sala &middot; Prinz Rudolf</h1>
  <p>Accesso riservato</p>
  <div class="box">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" enterkeyhint="go">
    <button id="enter">Entra</button>
    <div class="err" id="err"></div>
    <label><input type="checkbox" id="remember"> Ricorda su questo dispositivo</label>
  </div>
</div>

<div id="app" style="display:none">
<header>
  <div class="brand">
    <div class="mark">PR</div>
    <div><small>Prinz Rudolf &middot; Sala</small><h1>Cantina dei Vini</h1></div>
    <span class="rolebadge" id="roleBadge">Sala</span>
  </div>
</header>
<main>
  <div class="tools">
    <div class="search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input id="q" type="search" placeholder="Cerca vino o produttore&hellip;" autocomplete="off">
    </div>
    <button class="addbtn" id="addBtn" style="display:none" onclick="openForm()">+ Vino</button>
  </div>
  <div class="chips" id="chips"></div>
  <div id="list"><div class="loading">Carico la cantina&hellip;</div></div>
</main>
<footer>Prinz Rudolf &middot; Merano &mdash; Sala</footer>
</div>

<div id="modal"><div class="sheet">
  <h3 id="mTitle">Nuovo vino</h3>
  <div class="fld"><label>Nome del vino</label><input id="f_nome" placeholder="Es. Barolo DOCG"></div>
  <div class="row2">
    <div class="fld"><label>Tipo</label><select id="f_tipo"><option>Rosso</option><option>Bianco</option><option>Bollicine</option><option>Rosato</option><option>Dolce</option></select></div>
    <div class="fld"><label>Annata</label><input id="f_annata" placeholder="Es. 2019"></div>
  </div>
  <div class="fld"><label>Produttore / Cantina</label><input id="f_prod" placeholder="Es. Cantina..."></div>
  <div class="fld"><label>Zona / Regione</label><input id="f_zona" placeholder="Es. Piemonte"></div>
  <div class="row2">
    <div class="fld"><label>Prezzo carta (&euro;)</label><input id="f_prezzo" inputmode="decimal" placeholder="Es. 38"></div>
    <div class="fld"><label>Giacenza (bottiglie)</label><input id="f_giac" inputmode="numeric" placeholder="Es. 12"></div>
  </div>
  <div class="fld"><label>Posizione in cantina</label><input id="f_pos" placeholder="Es. Scaffale B, ripiano 2"></div>
  <div class="fld"><label>Abbinamento</label><input id="f_abb" placeholder="Es. Carni rosse, brasati, formaggi stagionati"></div>
  <div class="fld"><label>Note di servizio</label><textarea id="f_note" placeholder="Es. servire a 18&deg;C, decantare 30 min"></textarea></div>
  <div class="mbtns"><button class="cancel" onclick="closeForm()">Annulla</button><button class="save" id="saveBtn" onclick="saveWine()">Salva</button></div>
</div></div>

<div id="verbadge" style="position:fixed;left:6px;bottom:6px;z-index:9999;background:rgba(0,0,0,.5);color:#fff;font-size:10px;padding:2px 7px;border-radius:10px;pointer-events:none">v 05/08 12:00</div>
<script>
var APP_VER='05/08 12:00';
var PW_SALA='sala2026';
var PW_DIR='direzione2026';
var SB_URL="https://hxjxbpifboufolhwawkc.supabase.co";
var SB_KEY="sb_publishable_Fxh5-b2a7Qtt-Pumw0MrMg_Hpjd2m7Y";
var ROLE='';
var VINI=[];
var FILT='Tutti';
var EDIT_ID=null;
async function sb(path,opts){opts=opts||{};var h={apikey:SB_KEY,'Content-Type':'application/json'};if(opts.headers)Object.assign(h,opts.headers);var r=await fetch(SB_URL+'/rest/v1/'+path,{method:opts.method||'GET',headers:h,body:opts.body});if(!r.ok)throw new Error('HTTP '+r.status);var t=await r.text();return t?JSON.parse(t):null;}
function esc(s){return (s==null?'':(''+s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function tcls(t){t=(t||'').toLowerCase();if(t.indexOf('ross')===0)return 't-rosso';if(t.indexOf('bianc')===0)return 't-bianco';if(t.indexOf('boll')===0)return 't-bollicine';if(t.indexOf('rosa')===0)return 't-rosato';return 't-dolce';}
function doEnter(){
  var v=document.getElementById('pw').value.trim();
  var rem=document.getElementById('remember').checked;
  var role='';
  if(v===PW_DIR)role='dir'; else if(v===PW_SALA)role='sala';
  if(!role){document.getElementById('err').textContent='Password errata';return;}
  if(rem){try{localStorage.setItem('sala_role',role);}catch(e){}}
  unlock(role);
}
function unlock(role){
  ROLE=role;
  document.getElementById('lock').style.display='none';
  document.getElementById('app').style.display='block';
  var b=document.getElementById('roleBadge');
  if(role==='dir'){b.textContent='Direzione';b.className='rolebadge dir';document.getElementById('addBtn').style.display='';}
  else{b.textContent='Sala';b.className='rolebadge';document.getElementById('addBtn').style.display='none';}
  loadCantina();
}
document.getElementById('enter').addEventListener('click',doEnter);
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')doEnter();});
try{var sr=localStorage.getItem('sala_role');if(sr==='dir'||sr==='sala')unlock(sr);}catch(e){}
async function loadCantina(){
  try{var r=await sb("kitchen_meta?k=eq.cantina&select=v");VINI=(r&&r[0]&&r[0].v&&r[0].v.vini)||[];}
  catch(e){document.getElementById('list').innerHTML='<div class="empty">Errore di connessione. Controlla internet e riprova.</div>';return;}
  renderChips();render();
}
async function saveCloud(){
  await sb('kitchen_meta?on_conflict=k',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({k:'cantina',v:{vini:VINI}})});
}
var TIPI=['Tutti','Rosso','Bianco','Bollicine','Rosato','Dolce'];
function renderChips(){
  var h='';for(var i=0;i<TIPI.length;i++){var t=TIPI[i];h+='<button class="chip'+(t===FILT?' on':'')+'" onclick="setFilt(\''+t+'\')">'+t+'</button>';}
  document.getElementById('chips').innerHTML=h;
}
function setFilt(t){FILT=t;renderChips();render();}
function render(){
  var q=(document.getElementById('q').value||'').toLowerCase().trim();
  var arr=VINI.filter(function(w){
    if(FILT!=='Tutti' && (w.tipo||'')!==FILT)return false;
    if(q){var hay=((w.nome||'')+' '+(w.prod||'')+' '+(w.zona||'')).toLowerCase();if(hay.indexOf(q)<0)return false;}
    return true;
  });
  var el=document.getElementById('list');
  if(!VINI.length){el.innerHTML='<div class="empty">La cantina &egrave; ancora vuota.'+(ROLE==='dir'?'<br>Tocca <b>+ Vino</b> per aggiungere il primo.':'<br>In aggiornamento.')+'</div>';return;}
  if(!arr.length){el.innerHTML='<div class="empty">Nessun vino trovato.</div>';return;}
  arr.sort(function(a,b){return (a.nome||'').localeCompare(b.nome||'');});
  var h='';
  arr.forEach(function(w){
    h+='<div class="wine"><div class="top"><div class="nome">'+esc(w.nome||'(senza nome)')+'<div><span class="tipo '+tcls(w.tipo)+'">'+esc(w.tipo||'')+'</span></div></div>';
    if(w.prezzo)h+='<div class="prezzo">'+esc(w.prezzo)+' &euro;</div>';
    h+='</div>';
    var sub=[];if(w.prod)sub.push(esc(w.prod));if(w.annata)sub.push(esc(w.annata));if(w.zona)sub.push(esc(w.zona));
    if(sub.length)h+='<div class="sub">'+sub.join(' &middot; ')+'</div>';
    if(w.abb)h+='<div class="abb"><b>Abbinamento:</b> '+esc(w.abb)+'</div>';
    if(w.note)h+='<div class="note">'+esc(w.note)+'</div>';
    if(ROLE==='dir'){
      var mag=[];if(w.giac!==''&&w.giac!=null)mag.push('Giacenza: '+esc(w.giac)+' bott.');if(w.pos)mag.push('Posizione: '+esc(w.pos));
      if(mag.length)h+='<div class="mag">'+mag.join(' &nbsp;&middot;&nbsp; ')+'</div>';
      h+='<div class="acts"><button class="mod" onclick="openForm(\''+w.id+'\')">Modifica</button><button class="del" onclick="delWine(\''+w.id+'\')">Elimina</button></div>';
    }
    h+='</div>';
  });
  el.innerHTML=h;
}
document.getElementById('q').addEventListener('input',render);
function openForm(id){
  if(ROLE!=='dir')return;
  EDIT_ID=id||null;
  var w=id?VINI.filter(function(x){return x.id===id;})[0]:null;
  document.getElementById('mTitle').textContent=w?'Modifica vino':'Nuovo vino';
  document.getElementById('f_nome').value=w?(w.nome||''):'';
  document.getElementById('f_tipo').value=w?(w.tipo||'Rosso'):'Rosso';
  document.getElementById('f_annata').value=w?(w.annata||''):'';
  document.getElementById('f_prod').value=w?(w.prod||''):'';
  document.getElementById('f_zona').value=w?(w.zona||''):'';
  document.getElementById('f_prezzo').value=w?(w.prezzo||''):'';
  document.getElementById('f_giac').value=w?(w.giac||''):'';
  document.getElementById('f_pos').value=w?(w.pos||''):'';
  document.getElementById('f_abb').value=w?(w.abb||''):'';
  document.getElementById('f_note').value=w?(w.note||''):'';
  document.getElementById('modal').style.display='flex';
}
function closeForm(){document.getElementById('modal').style.display='none';EDIT_ID=null;}
async function saveWine(){
  if(ROLE!=='dir')return;
  var nome=document.getElementById('f_nome').value.trim();
  if(!nome){alert('Metti almeno il nome del vino.');return;}
  var obj={
    id:EDIT_ID||('v'+Date.now()),
    nome:nome,
    tipo:document.getElementById('f_tipo').value,
    annata:document.getElementById('f_annata').value.trim(),
    prod:document.getElementById('f_prod').value.trim(),
    zona:document.getElementById('f_zona').value.trim(),
    prezzo:document.getElementById('f_prezzo').value.trim(),
    giac:document.getElementById('f_giac').value.trim(),
    pos:document.getElementById('f_pos').value.trim(),
    abb:document.getElementById('f_abb').value.trim(),
    note:document.getElementById('f_note').value.trim()
  };
  var btn=document.getElementById('saveBtn');btn.textContent='Salvo...';btn.disabled=true;
  if(EDIT_ID){for(var i=0;i<VINI.length;i++){if(VINI[i].id===EDIT_ID){VINI[i]=obj;break;}}}
  else{VINI.push(obj);}
  try{await saveCloud();}catch(e){alert('Non salvato, controlla internet');btn.textContent='Salva';btn.disabled=false;return;}
  btn.textContent='Salva';btn.disabled=false;
  closeForm();renderChips();render();
}
async function delWine(id){
  if(ROLE!=='dir')return;
  var w=VINI.filter(function(x){return x.id===id;})[0];
  if(!confirm('Eliminare "'+(w?w.nome:'')+'" dalla cantina?'))return;
  VINI=VINI.filter(function(x){return x.id!==id;});
  try{await saveCloud();}catch(e){alert('Non salvato, controlla internet');return;}
  render();
}
(async function selfUpdate(){try{if(sessionStorage.getItem('upd_sala'))return;var r=await fetch(location.pathname+'?chk='+Date.now(),{cache:'no-store'});if(!r.ok)return;var t=await r.text();var m=t.match(/>v (\d\d\/\d\d \d\d:\d\d)</);var latest=m&&m[1];if(latest&&latest!==APP_VER){sessionStorage.setItem('upd_sala','1');location.replace(location.pathname+'?v='+Date.now());}}catch(e){}})();
</script>
</body>
</html>

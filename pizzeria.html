ma sulla pizza, non colare."},{n:"Pomodori confit (rossi e gialli)",c:"Pronti all'uso",r:"Comprati: basta aprire i barattoli. Scolare leggermente, tenere in vaschetta."},{n:"Peperone crusco",c:"Pronti all'uso",r:"Spaccare e tritare grossolanamente. A finitura sopra la pizza."},{n:"Cipolla di Tropea agrodolce",c:"Pronti all'uso",r:"Comprata: aprire la busta, tenere in vaschetta."},{n:"'Nduja (crema)",c:"Pronti all'uso",r:"'Nduja in crema spalmabile [prodotto da trovare]. A ciuffi/velo sulla pizza."},{n:"Guanciale croccante",c:"Preparazioni base",r:"Guanciale tagliato finemente, steso su placca con carta da forno e reso croccante in forno. Raffreddare; si mette a CRUDO sulla pizza a fine cottura."},{n:"Cipolla croccante",c:"Pronti all'uso",r:"Comprata già pronta: metterla in linea, a finitura sulla pizza."},{n:"Melanzane alla piastra (Norma)",c:"Preparazioni base",r:"Melanzane a cubetti (col cutter), grigliate in piastra con olio evo, sale, pepe, aglio e basilico a julienne. Raffreddare, tenere in vaschetta."},{n:"Patate al forno (Patate e speck)",c:"Preparazioni base",r:"Patate a cubetti, sbollentate in acqua bollente, scolate; condire con sale, olio evo e rosmarino tritato, poi tostare in forno fino a doratura. Raffreddare, tenere in vaschetta."},{n:"Noci tostate",c:"Preparazioni base",r:"Noci tostate in forno (150°C finché profumano) e raffreddate."},{n:"Pesto di basilico (facile, senza pacojet)",c:"Preparazioni base",r:"Per ~500 g: basilico 100 g sbollentato 10 sec e raffreddato in acqua e ghiaccio, strizzato (tiene il verde); frullare al mixer/Bimby con pinoli 40 g (o metà mandorle), grana 60 g + pecorino 20 g, 1/2 spicchio d'aglio, olio ~200 ml METÀ evo e METÀ di semi (l'evo da solo è troppo aggressivo), sale. Coprire con un filo d'olio. Resta verde e si conserva bene — niente pacojet."}];

function vetAddZone(){var n=prompt('Nome della nuova zona (es. Colonna, Ripiano...):','Nuova zona');if(n===null)return;var L=vetLoad();L.zones.push({name:n||'Nuova zona',type:"grid",bins:["","","",""]});vetSave(L);render();}
function vetRenameZone(zi){var L=vetLoad();var n=prompt('Rinomina la zona:',L.zones[zi].name);if(n===null)return;L.zones[zi].name=n||L.zones[zi].name;vetSave(L);render();}
function vetDelZone(zi){var L=vetLoad();if(!confirm('Eliminare la zona "'+L.zones[zi].name+'"?'))return;L.zones.splice(zi,1);vetSave(L);render();}
function _binRef(L,zi,ci,bi){var z=L.zones[zi];if(ci<0)return {get:function(){return z.bins[bi];},set:function(v){z.bins[bi]=v;}};return {get:function(){return z.cols[ci].bins[bi];},set:function(v){z.cols[ci].bins[bi]=v;}};}
function vetClear(zi,ci,bi){var L=vetLoad();_binRef(L,zi,ci,bi).set("");vetSave(L);render();}
var _vetTarget=null;
function vetOpenPick(zi,ci,bi){
  _vetTarget=[zi,ci,bi];
  var m=document.getElementById('vetmodal');
  if(!m){m=document.createElement('div');m.id='vetmodal';m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:flex-end;justify-content:center';document.body.appendChild(m);}
  m.innerHTML='<div style="background:#fff;width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px">'
    +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><b style="font-size:17px;flex:1">Cosa ci metti?</b><button class="ctrlbtn" style="width:auto;margin:0;padding:6px 10px" onclick="vetClosePick()">chiudi</button></div>'
    +'<input id="vetsearch" placeholder="Cerca prodotto…" oninput="vetRenderPick(this.value)" style="width:100%;box-sizing:border-box;padding:11px;border:1px solid #ddd;border-radius:10px;font:inherit;margin-bottom:8px">'
    +'<div style="display:flex;gap:6px;margin-bottom:10px"><input id="vetcustom" placeholder="…oppure scrivilo a mano" style="flex:1;padding:10px;border:1px solid #ddd;border-radius:10px;font:inherit"><button class="ctrlbtn" style="width:auto;margin:0" onclick="vetPickCustom()">Metti</button></div>'
    +'<div id="vetlist"></div></div>';
  m.style.display='flex';
  m.onclick=function(e){if(e.target===m)vetClosePick();};
  vetRenderPick('');
}
function vetClosePick(){var m=document.getElementById('vetmodal');if(m)m.style.display='none';_vetTarget=null;}
function _vetUsed(){var L=vetLoad();var u={};L.zones.forEach(function(z){var arr=[];if(z.cols)z.cols.forEach(function(c){arr=arr.concat(c.bins);});if(z.bins)arr=arr.concat(z.bins);arr.forEach(function(b){if(b)u[b]=1;});});return u;}
function _vetRemoved(){var r={};try{r=JSON.parse(localStorage.getItem('pizza_prod_removed')||'{}')||{};}catch(e){r={};}return r;}
function vetRemoveProd(name){var r=_vetRemoved();r[name]=1;try{localStorage.setItem('pizza_prod_removed',JSON.stringify(r));}catch(e){}var e=document.getElementById('vetsearch');vetRenderPick(e?e.value:'');}
function vetRestoreProds(){if(!confirm('Rimettere tutti i prodotti tolti dalla lista?'))return;try{localStorage.removeItem('pizza_prod_removed');}catch(e){}var e=document.getElementById('vetsearch');vetRenderPick(e?e.value:'');}
function vetRenderPick(f){
  f=(f||'').toLowerCase().trim();
  var el=document.getElementById('vetlist');if(!el)return;
  var used=_vetUsed(),rem=_vetRemoved();
  var totAll=0,totRem=0;VETPROD.forEach(function(gr){gr[1].forEach(function(x){if(rem[x])return;totAll++;if(!used[x])totRem++;});});
  var h='<div style="font-size:12.5px;font-weight:800;color:#1e7a46;margin:0 2px 8px">Ancora da sistemare: '+totRem+' su '+totAll+'</div>';
  VETPROD.forEach(function(gr){
    var items=gr[1].filter(function(x){return (!f||x.toLowerCase().indexOf(f)>=0)&&!used[x]&&!rem[x];});
    if(!items.length)return;
    h+='<div style="font-size:12px;font-weight:800;color:#8a8378;margin:8px 2px 5px">'+gr[0]+'</div><div style="display:flex;flex-wrap:wrap;gap:6px">';
    items.forEach(function(x){var q=JSON.stringify(x).replace(/"/g,'&quot;');
      h+='<span style="display:inline-flex;align-items:stretch;border:1px solid #c9a227;border-radius:16px;overflow:hidden">'
        +'<button onclick="vetPick('+q+')" style="border:0;background:#fff;color:#6b1f2a;padding:7px 10px;font:inherit;font-size:13px;font-weight:700;cursor:pointer">'+esc(x)+'</button>'
        +'<button onclick="vetRemoveProd('+q+')" title="Togli dalla lista" style="border:0;border-left:1px solid #eadca0;background:#faf6e8;color:#b23a3a;padding:0 9px;font:inherit;font-size:13px;font-weight:900;cursor:pointer">×</button></span>';
    });
    h+='</div>';
  });
  if(h.indexOf('vetPick(')<0)h+='<div style="color:#999;padding:10px">Niente da mostrare qui. Scrivi a mano sopra, o ripristina la lista in fondo.</div>';
  var done=[];VETPROD.forEach(function(gr){gr[1].forEach(function(x){if(used[x]&&!rem[x]&&(!f||x.toLowerCase().indexOf(f)>=0))done.push(x);});});
  if(done.length){
    h+='<div style="font-size:12px;font-weight:800;color:#b8b2a6;margin:16px 2px 5px;border-top:1px dashed #ddd;padding-top:10px">✓ Già in vetrina (tocca per rimetterne un\'altra)</div><div style="display:flex;flex-wrap:wrap;gap:6px">';
    done.forEach(function(x){h+='<button onclick="vetPick('+JSON.stringify(x).replace(/"/g,'&quot;')+')" style="border:1px solid #e0dccf;background:#f3f1ea;color:#a9a195;border-radius:16px;padding:7px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;text-decoration:line-through">'+esc(x)+'</button>';});
    h+='</div>';
  }
  var nrem=Object.keys(rem).length;
  if(nrem){h+='<div style="margin-top:14px;border-top:1px dashed #ddd;padding-top:10px"><button onclick="vetRestoreProds()" style="border:1px solid #ddd;background:#fff;color:#6b1f2a;border-radius:9px;padding:7px 12px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer">↺ Ripristina lista prodotti ('+nrem+' tolti)</button></div>';}
  el.innerHTML=h;
}

function vetPick(name){
  if(!_vetTarget)return;var L=vetLoad();_binRef(L,_vetTarget[0],_vetTarget[1],_vetTarget[2]).set(name);vetSave(L);vetClosePick();render();
}
function vetPickCustom(){
  var e=document.getElementById('vetcustom');var v=e?e.value.trim():'';if(!v)return;vetPick(v);
}
function placeholder(txt){return '<div class="placeholder">'+esc(txt)+'</div>';}
function render(){var v=document.getElementById('view');
  if(cur==='pizze')v.innerHTML=pizzeView();
  else if(cur==='frighi'){if(!_vetLoaded){v.innerHTML='<div class="hint">Carico la vetrina\u2026</div>';vetCloudLoad().then(function(){if(cur==='frighi')v.innerHTML=frighiView();});}else{v.innerHTML=frighiView();}}
  else if(cur==='ricette')v.innerHTML=ricetteView();
  else if(cur==='giro')v.innerHTML=giroView();
  else if(cur==='ordini')v.innerHTML=ordiniView();
}
renderTabs();render();
</script>
</body>
</html>

<style>
  :root{--red:#1c1c1c;--red-d:#000;--yellow:#c9a227;--wine:#6b1f2a;--bg:#faf8f2;--paper:#fff;--ink:#1a1a1a;--muted:#8a8378;--line:#ececec}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;padding-bottom:40px}
  header{position:sticky;top:0;z-index:20;background:var(--red);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 16px 0;box-shadow:0 3px 16px rgba(0,0,0,.25)}
  .brand{display:flex;align-items:center;gap:12px;padding-bottom:12px}
  .brand .mark{width:46px;height:46px;border-radius:14px;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--red);font-size:17px}
  .brand h1{font-size:20px;margin:0;font-weight:800}
  .brand small{display:block;font-size:10px;opacity:.9;letter-spacing:1.5px;text-transform:uppercase;font-weight:700}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;border:none;background:rgba(255,255,255,.18);color:#fff;border-radius:30px;padding:9px 16px;font-size:14px;font-weight:800;cursor:pointer;white-space:nowrap}
  .tab.on{background:var(--yellow);color:var(--red-d)}
  main{max-width:860px;margin:0 auto;padding:16px}
  .hint{font-size:12.5px;color:var(--muted);margin:2px 0 14px;font-weight:600}
  .catlbl{font-size:12px;font-weight:900;letter-spacing:1px;color:var(--wine);text-transform:uppercase;margin:18px 0 8px;border-bottom:2px solid var(--yellow);padding-bottom:4px}
  .pz{background:var(--paper);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);padding:12px 14px;margin-bottom:10px}
  .pz .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .pz .nm{font-size:15.5px;font-weight:800;color:var(--ink)}
  .pz .pr{font-size:14px;font-weight:800;color:var(--wine);white-space:nowrap}
  .pz .ing{font-size:13px;color:#555;margin-top:4px}
  .sec{background:var(--paper);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);padding:12px 14px;margin-bottom:12px}
  .sec h3{margin:0 0 4px;font-size:15px;color:var(--wine)}
  .sub{font-size:11.5px;color:var(--muted);font-weight:700;margin:8px 0 6px}
  .bin{background:#fbf9f3;border:1px solid var(--line);border-radius:8px;padding:8px 6px;text-align:center;font-size:12px;color:var(--ink)}
  .grid{display:grid;gap:6px}
  .big{background:#faece7;border:1px solid #f0997b;color:#712b13;font-weight:700}
  .amb{background:#faeeda;border:1px solid #ef9f27;color:#633806}
  .pink{background:#fbeaf0;border:1px solid #ed93b1;color:#72243e}
  .teal{background:#e1f5ee;border:1px solid #5dcaa5;color:#04342c}
  .todo{border:1px dashed #ef9f27;background:#faeeda;color:#854f0b}
  .row{display:flex;flex-wrap:wrap;gap:6px}
  .placeholder{background:var(--paper);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);padding:22px 16px;text-align:center;color:var(--muted);font-weight:600}
  .ver{position:fixed;left:6px;bottom:4px;font-size:9px;color:#bbb;background:#000;padding:2px 5px;border-radius:5px;opacity:.5;z-index:99}
</style>

<script>
const APP_VER='29/07 19:40';
document.getElementById('ver').textContent='v '+APP_VER;
const TABS=[['giro','Il giro'],['frighi','Frighi'],['ricette','Ricette'],['pizze','Le pizze'],['ordini','Ordini']];
let cur='pizze';
const PIZZE=[{cat:"Le classiche",items:[["Margherita","8,50","pomodoro, mozzarella fior di latte, origano"],["Prosciutto e funghi","11,00","pomodoro, mozzarella fior di latte, prosciutto cotto del contadino, funghi (champignon) trifolati, origano"],["Salame piccante","11,00","pomodoro, mozzarella fior di latte, spianata calabra piccante Levoni"],["Capricciosa","12,00","pomodoro, mozzarella fior di latte, prosciutto cotto del contadino, carciofini sott’olio, champignon trifolati"],["Diavola","11,50","pomodoro, mozzarella fior di latte, spianata calabra piccante Levoni, olive leccino, peperoni lombardi"],["4 Stagioni","13,00","pomodoro, mozzarella fior di latte, divisa in 4 spicchi: carciofi · funghi (champignon) trifolati · prosciutto cotto del contadino · olive e acciughe"],["Rucolona","14,00","pomodoro, mozzarella fior di latte, prosciutto crudo, rucola, pomodorini, scaglie di grana, olio EVO"]]},
{cat:"Le bianche",items:[["Gustosa","13,00","mozzarella fior di latte, gorgonzola, salsiccia locale al finocchietto, noci tostate, olio EVO"],["Carbonara","13,00","mozzarella fior di latte, pecorino, crema alla carbonara, guanciale croccante, polvere di pepe nero"],["Quattro formaggi","15,00","base fior di latte; gorgonzola DOP, taleggio, fontina di malga a pezzi, grana padano grattugiato; pere a cubetti saltate (olio, rosmarino), filo di miele, polvere di nocciole tostate"],["Patate e speck","14,00","base fior di latte, patate al forno, speck altoatesino, cipolla caramellata, polvere di rosmarino"],["Roast beef e rucola","12,00","base fior di latte, roast beef rosa a fette (il nostro), rucola, scaglie di grana, maionese alla senape, grattata di limone"],["Light per finta","15,00","fior di latte, burrata, pesto di basilico, pomodorini gialli e rossi confit, olio EVO, basilico"]]},
{cat:"Le speciali",items:[["Napoli 2.0","13,50","pomodoro, fior di latte, mozzarella di bufala affumicata, pomodorini, basilico, olio EVO"],["Norma","13,00","pomodoro, fior di latte, melanzana alla piastra, ricotta affumicata, basilico (sempre presente)"],["Amatriciana","14,00","pomodoro (nostra salsa base), guanciale croccante, pecorino, cipolla croccante, basilico"],["Margherita alla napoletana","12,00","pomodoro, mozzarella di bufala, parmigiano, pecorino, basilico, olio EVO"],["Prinz marinara","14,00","pomodoro, pomodorini gialli e rossi confit, olive leccino, filetto di acciuga, aglio in polvere"],["'Nduja e stracciatella","14,00","pomodoro, fior di latte, 'nduja calabrese, stracciatella a crudo, basilico"]]},
{cat:"Quelle ai 5 cereali",items:[["Caponatina di verdure","13,00","impasto 5 cereali, fior di latte, caponatina di verdure (melanzane, zucchine, peperoni in agrodolce), parmigiano, olio EVO"],["Tonno rosso rosè tataki","14,00","impasto 5 cereali, fior di latte, cipolla di Tropea agrodolce, tonno rosso rosè tataki a fette, maionese al wasabi, peperone crusco"],["Boscaiola Monte27","16,00","impasto 5 cereali, fior di latte, crema di Monte 27, funghi misti trifolati all'aglio e prezzemolo, olio EVO"],["Salsiccia e friarielli","15,00","impasto 5 cereali, fior di latte, salsiccia locale al finocchietto, friarielli, pecorino, olio EVO"]]}];
const IMP={nome:"Impasto napoletano serale (impasto sera, palline mattina)",ing:["10 kg farina Caputo Nuvola", "6,5 l acqua fredda", "280 g sale", "10 g lievito di birra fresco"],proc:"Idratazione 65% · totale impasto ~16,2 kg per 60 palline da 270 g. Impastatrice a braccia tuffanti, sempre velocità 1. SERA — IMPASTO: 1) Sciogliere il lievito nell'acqua fredda (tenere indietro 400 g di acqua); aggiungere circa metà farina e far girare 2-3 minuti fino a pastella grossolana senza grumi secchi. 2) Aggiungere il sale, poi la farina restante gradualmente, una parte alla volta aspettando che la precedente sia assorbita (4-5 minuti in totale). 3) Impastare a velocità 1: nei primi 10 minuti è normale che sembri slegato, non aggiungere nulla (la tuffante è lenta a far partire la maglia). 4) A metà impasto, quando la massa fa corpo, aggiungere i 400 g di acqua a filo, poco alla volta, aspettando che ogni aggiunta sia assorbita. 5) Totale impastamento 18-22 minuti: pronto quando è liscio, lucido, si stacca dalla vasca e avvolge le braccia (prova del velo: un pezzetto tirato tra le dita si stende sottile senza strapparsi). Giudicare con gli occhi, non col timer: se la superficie è ancora strappata e opaca, non è pronto. 6) Se dopo 18-20 minuti è ancora strappato: massimo altri 4-5 minuti, poi stop, coprire la vasca e riposo 20 minuti; ripartire a velocità 1 per 3-5 minuti e si liscia velocemente. Mai insistere all'infinito e mai aggiungere farina per correggere. 7) Temperatura finale obiettivo 23-25°C. 8) Puntata in massa coperta 1 ora a temperatura ambiente. 9) Vasca coperta in frigo a +4°C per la notte (12-16 ore). MATTINA — PALLINE: 10) Tirare fuori la massa e lasciarla 1 ora a temperatura ambiente. 11) Spezzare in 60 palline da 270 g, chiudere bene. 12) Appretto in cassette chiuse 4-6 ore a 24-26°C, fino a palline rilassate e gonfie (per il pranzo: impallinare appena arrivati e tenere le cassette a 26-28°C). SERVIZIO: 13) Stendere su semola schiacciando dal centro verso il bordo senza toccare il cornicione, allargare a 30-32 cm. 14) Condire e cuocere al massimo del forno su pietra o teglia rovente: 450°C+ 90 secondi, oppure in forno a 300°C 5-7 minuti. NOTE — Velocità sempre 1: la tuffante lavora lenta e scalda poco; la velocità 2 al massimo negli ultimi 2-3 minuti per chiudere l'incordatura, solo se serve. Palline troppo indietro dopo l'appretto: allungare a temperatura più alta; troppo avanti (sgonfie, appiccicose): in frigo fino al servizio. Versione classica senza olio né zuccheri; se a 300°C resta pallida aggiungere 150 g olio + 100 g zucchero. La maturazione notturna in frigo dà più sapore, digeribilità e palline più gestibili alla stesa. IDRATAZIONE 65% — maggiore estensibilità alla stesa. Prima di stendere: palline fuori dal frigo 4-5 ore a 22-24°C (non bastano 1-2 ore). Test del dito: la pallina deve cedere e risalire lentamente.",resa:"~16,2 kg per 60 palline da 270 g · idratazione 65%",cott:"Forno 450°C+ 90 sec su pietra/teglia rovente, oppure 300°C 5-7 min"};
const LEG=[{n:"Salsa pomodoro base (pizzeria)",c:"Preparazioni base",r:"Su 3 kg di pomodoro (passata/pelati schiacciati): sale fino 30 g, aglio 10 g fresco grattugiato (o 5 g in polvere), pepe nero 3 g, olio evo 60 ml, basilico fresco 30 g frullato con un filo d'olio. A crudo: frullare il basilico con poco pomodoro e l'olio, unire al resto del pomodoro con sale, aglio, pepe e olio; mescolare, assaggiare, far riposare in frigo. Non si cuoce (cuoce in forno sulla pizza)."},{n:"Pere saltate (per Quattro formaggi)",c:"Preparazioni base",r:"Pere a cubetti saltate in padella con olio evo e un rametto di rosmarino, a fiamma viva, finché diventano succose e leggermente caramellate ma ancora sode. Togliere il rosmarino, raffreddare. Si mettono sulla pizza a fine cottura."},{n:"Polvere di nocciole tostate",c:"Preparazioni base",r:"Nocciole pelate tostate (forno 150°C finché profumano) e raffreddate bene. Frullare a impulsi fino a polvere grossa/fine — NON frullare troppo o diventa pasta di nocciole. Eventuale pizzico di sale. Conservare in barattolo asciutto. A finitura sopra la pizza."},{n:"Cipolla caramellata",c:"Preparazioni base",r:"Cipolle a julienne stufate piano in olio evo (o burro) con un pizzico di sale e un velo di zucchero; a fine cottura sfumare con un goccio di aceto (o vino) e ridurre fino a cipolle morbide, dolci e ambrate. Raffreddare."},{n:"Polvere di rosmarino",c:"Preparazioni base",r:"Aghi di rosmarino essiccati (forno basso ~70-80°C o essiccatore finché friabili) e frullati a polvere fine; setacciare. Conservare in barattolo asciutto. A finitura sopra la pizza."},{n:"Maionese alla senape",c:"Preparazioni base",r:"Maionese (nostra o di base) montata con senape (Digione + un po' di senape in grani per croccantezza), sale e un filo di limone. Regolare la quantità di senape a piacere. In sac à poche/biberon, a finitura sulla pizza."},{n:"Maionese al wasabi",c:"Preparazioni base",r:"Maionese (nostra o base) montata con wasabi (pasta o polvere, dosare a piacere), sale e un filo di lime. In biberon/sac à poche, a finitura."},{n:"Crema di Monte 27",c:"Preparazioni base",r:"Formaggio Monte 27 scaldato dolcemente con un po' di panna/latte fino a crema liscia e spalmabile (o frullato liscio). Tenere morbida; a velo/ciuffi sulla pizza."},{n:"Tataki di tonno (per pizza)",c:"Preparazioni base",r:"Come a mezza pensione: tonno scottato velocemente all'esterno e crudo al cuore, raffreddato e affettato. Si mette a crudo a fine cottura. (Stesso tonno della mezza pensione: niente spreco.)"},{n:"Funghi misti trifolati (aglio e prezzemolo)",c:"Preparazioni base",r:"Funghi misti a pezzi saltati in padella con olio evo e aglio a fuoco vivo finché asciutti e dorati; sale, pepe e prezzemolo tritato a fine cottura. Raffreddare e tenere in vaschetta."},{n:"Caponatina di verdure (5 cereali)",c:"Preparazioni base",r:"Melanzane, zucchine e peperoni a cubetti, saltati in olio evo finché coloriti (le melanzane prima, da sole). A parte soffritto di cipolla; unire le verdure, sedano sbollentato a cubetti, olive e capperi dissalati, un po' di pomodoro. Agrodolce: sfumare con aceto + un cucchiaio di zucchero e far asciugare. Basilico a fine cottura. Raffreddare, tenere in vaschetta pronta. Si posa sulla pizza, niente cottura al momento."},{n:"Champignon trifolati",c:"Preparazioni base",r:"Champignon comprati in busta: scolare bene e condire a crudo con aglio, pepe nero e prezzemolo fresco tritato."},{n:"Friarielli",c:"Preparazioni base",r:"Friarielli in barattolo: aprire, scolare e saltare in padella con olio evo, aglio in polvere, sale e pepe. Raffreddare, tenere in vaschetta."},{n:"Crema alla carbonara (Bimby)",c:"Preparazioni base",r:"PROPOSTA (da confermare) per ~500 g: 6 tuorli + 150 g pecorino (o metà parmigiano) + 200 ml acqua (o latte) + pepe nero. Bimby a ~70°C, vel. 4 per 6-7 minuti fino a crema liscia e nappante (non deve stracciare). Raffreddare, tenere morbida; in sac à poche sulla pizza."},{n:"Pomodori confit (rossi e gialli)",c:"Pronti all'uso",r:"Comprati: basta aprire i barattoli. Scolare leggermente, tenere in vaschetta."},{n:"Peperone crusco",c:"Pronti all'uso",r:"Spaccare e tritare grossolanamente. A finitura sopra la pizza."},{n:"Cipolla di Tropea agrodolce",c:"Pronti all'uso",r:"Comprata: aprire la busta, tenere in vaschetta."},{n:"'Nduja (crema)",c:"Pronti all'uso",r:"'Nduja in crema spalmabile [prodotto da trovare]. A ciuffi/velo sulla pizza."},{n:"Guanciale croccante",c:"Preparazioni base",r:"Guanciale tagliato finemente, steso su placca con carta da forno e reso croccante in forno. Raffreddare; si mette a CRUDO sulla pizza a fine cottura."},{n:"Cipolla croccante",c:"Pronti all'uso",r:"Comprata già pronta: metterla in linea, a finitura sulla pizza."},{n:"Melanzane alla piastra (Norma)",c:"Preparazioni base",r:"Melanzane a cubetti (col cutter), grigliate in piastra con olio evo, sale, pepe, aglio e basilico a julienne. Raffreddare, tenere in vaschetta."},{n:"Patate al forno (Patate e speck)",c:"Preparazioni base",r:"Patate a cubetti, sbollentate in acqua bollente, scolate; condire con sale, olio evo e rosmarino tritato, poi tostare in forno fino a doratura. Raffreddare, tenere in vaschetta."},{n:"Noci tostate",c:"Preparazioni base",r:"Noci tostate in forno (150°C finché profumano) e raffreddate."},{n:"Pesto di basilico (facile, senza pacojet)",c:"Preparazioni base",r:"Per ~500 g: basilico 100 g sbollentato 10 sec e raffreddato in acqua e ghiaccio, strizzato (tiene il verde); frullare al mixer/Bimby con pinoli 40 g (o metà mandorle), grana 60 g + pecorino 20 g, 1/2 spicchio d'aglio, olio evo ~200 ml, sale. Coprire con un filo d'olio. Resta verde e si conserva bene — niente pacojet."}];
const ORD=[{forn:"CAPONE",items:["Olive Leccino"]},{forn:"DE NOIA",items:["Tonno rosso rosè (per tataki)"]},{forn:"DEMETZ",items:["Nocciole", "Noci"]},{forn:"FOPPA",items:["Aceto", "Aglio in polvere WIEBERG", "Capperi (caponata)", "Formaggio Monte 27", "Lime / Limone", "Maionese GOURMET", "Miele a dosatore spruzzo ", "Mozzarella di bufala", "Origano ", "Passata/pelati (salsa base)", "Pepe nero MACINATO ", "Senape (Digione)", "Wasabi"]},{forn:"GASTROFRESH",items:["Aglio fresco treccia", "Basilico", "Burrata", "Carciofini sott'olio", "Champignon (in busta)", "Cipolle (per caramellata)", "Farina Caputo Nuvola", "Fontina di malga", "Formaggio di malga", "Funghi misti (trifolati)", "Grana Padano", "Lievito di birra fresco", "Melanzane", "Mozzarella di bufala affumicata", "Parmigiano", "Patate", "Peperoni", "Pere", "Pomodorini", "Prezzemolo", "Ricotta affumicata", "Rosmarino 100gr", "Rucola 100gr", "Sedano (caponata)", "Stracciatella", "Zucchine"]},{forn:"IMES",items:["Acciughe (filetti)", "Fior di latte (mozzarella pizzeria)", "Gorgonzola DOP", "Olio EVO", "Pecorino", "Pinoli", "Sale fino", "Semola (per stesura)", "Speck altoatesino", "Taleggio", "Zucchero"]},{forn:"MENU",items:["'Nduja (crema)", "Cipolla di Tropea agrodolce (busta)", "Friarielli (barattolo)", "Peperone crusco", "Pomodori confit gialli", "Pomodori confit rossi"]},{forn:"METRO",items:["Farina ai 5 cereali"]},{forn:"SIEBENFORCHER",items:["Guanciale", "Prosciutto cotto del contadino", "Roast beef (nostro) FESA DI MANZO", "Salsiccia locale al finocchietto", "Spianata calabra piccante Levoni"]}];
function esc(s){return (s==null?'':String(s)).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function ricetteView(){
 var h='<div class="hint">Impasto base + tutte le nostre preparazioni (la leggenda). Dosi scalabili.</div>';
 h+='<div class="catlbl">Impasto</div><div class="pz"><div class="top"><span class="nm">'+esc(IMP.nome)+'</span></div><div class="ing"><b>Ingredienti:</b> '+IMP.ing.map(esc).join(' &middot; ')+'</div><div class="ing"><b>Resa:</b> '+esc(IMP.resa)+'</div><div class="ing">'+esc(IMP.proc)+'</div><div class="ing"><b>Cottura:</b> '+esc(IMP.cott)+'</div></div>';
 var cats={}; LEG.forEach(function(x){(cats[x.c]=cats[x.c]||[]).push(x);});
 Object.keys(cats).forEach(function(c){ h+='<div class="catlbl">'+esc(c)+'</div>'; cats[c].forEach(function(x){ h+='<div class="pz"><div class="top"><span class="nm">'+esc(x.n)+'</span></div><div class="ing">'+esc(x.r)+'</div></div>'; }); });
 return h;
}
function giroView(){
 var steps=[
  ['Sera prima','Fare l\'impasto napoletano (vedi Ricette). Puntata 1 h, poi in frigo +4\u00b0C per la notte.'],
  ['Mattina \u2014 arrivo','Tirare fuori la massa 1 h a temperatura ambiente, poi fare le palline da 270 g e mettere in cassette per l\'appretto.'],
  ['Mattina \u2014 mise en place','Preparare/rifornire le preparazioni della leggenda e impostare i frighi e la vetrina come da mappa (tab Frighi).'],
  ['Prima del servizio','Controllare palline (prova del dito), semola per stendere, forno in temperatura.'],
  ['Servizio','Stendere su semola 30-32 cm, condire secondo la scheda pizza, cuocere 450\u00b0C+ ~90 sec.'],
  ['Chiusura','Pulire banco e vetrina, coprire ed etichettare le vaschette, controllare scorte e segnare gli ordini.']
 ];
 var h='<div class="hint">L\'ordine mentale del lavoro del pizzaiolo: arrivo \u2192 impasti \u2192 mise en place \u2192 servizio \u2192 chiusura.</div>';
 steps.forEach(function(s,i){ h+='<div class="pz"><div class="top"><span class="nm">'+(i+1)+'. '+esc(s[0])+'</span></div><div class="ing">'+esc(s[1])+'</div></div>'; });
 return h;
}
function ordiniView(){
 var h='<div class="hint">Base ordini pizzeria raggruppata per fornitore (da mappatura ingredienti). Ordina quello che manca.</div>';
 ORD.forEach(function(g){ h+='<div class="catlbl">'+esc(g.forn)+' &middot; '+g.items.length+' prodotti</div>'; g.items.forEach(function(it){ h+='<div class="pz"><div class="top"><span class="nm">'+esc(it)+'</span></div></div>'; }); });
 return h;
}
function renderTabs(){document.getElementById('tabs').innerHTML=TABS.map(function(t){return '<button class="tab'+(t[0]===cur?' on':'')+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>';}).join('');}
function setTab(t){cur=t;renderTabs();render();window.scrollTo(0,0);}
function pizzeView(){var h='<div class="hint">Menu pizzeria 2027 &middot; 23 pizze.</div>';PIZZE.forEach(function(g){h+='<div class="catlbl">'+esc(g.cat)+'</div>';g.items.forEach(function(p){h+='<div class="pz"><div class="top"><span class="nm">'+esc(p[0])+'</span><span class="pr">'+esc(p[1])+' &euro;</span></div><div class="ing">'+esc(p[2])+'</div></div>';});});return h;}

function placeholder(txt){return '<div class="placeholder">'+esc(txt)+'</div>';}
function render(){var v=document.getElementById('view');
  if(cur==='pizze')v.innerHTML=pizzeView();
  else if(cur==='frighi')v.innerHTML=frighiView();
  else if(cur==='ricette')v.innerHTML=ricetteView();
  else if(cur==='giro')v.innerHTML=giroView();
  else if(cur==='ordini')v.innerHTML=ordiniView();
}
renderTabs();render();
